<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="641" viewBox="0 0 1120 641" role="img" aria-labelledby="title description">
<title id="title">Boolean Search Engine: synthetic example output</title>
<desc id="description">Actual output captured by running python examples/demo.py. The text transcript is linked from the README.</desc>
<rect width="1120" height="641" rx="16" fill="#0b1220"/>
<rect x="0" y="0" width="8" height="641" rx="4" fill="#2dd4bf"/>
<text x="44" y="39" fill="#5eead4" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">PYTHON / CSC 484</text>
<text x="44" y="83" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Boolean Search Engine</text>
<text x="44" y="113" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Actual program output · newly authored synthetic inputs</text>
<g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21"><text x="44" y="169" fill="#5eead4" xml:space="preserve">$ python examples/demo.py</text><text x="44" y="198" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="227" fill="#dbe5f4" xml:space="preserve">Synthetic documents (zero-based IDs)</text><text x="44" y="256" fill="#dbe5f4" xml:space="preserve">  0: apple tv</text><text x="44" y="285" fill="#dbe5f4" xml:space="preserve">  1: samsung tv</text><text x="44" y="314" fill="#dbe5f4" xml:space="preserve">  2: sony tv</text><text x="44" y="343" fill="#dbe5f4" xml:space="preserve">  3: apple samsung</text><text x="44" y="372" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="401" fill="#dbe5f4" xml:space="preserve">Boolean queries</text><text x="44" y="430" fill="#dbe5f4" xml:space="preserve">  apple                -&gt; [0, 3]</text><text x="44" y="459" fill="#dbe5f4" xml:space="preserve">  apple &amp; tv           -&gt; [0]</text><text x="44" y="488" fill="#dbe5f4" xml:space="preserve">  samsung sony&amp;tv      -&gt; [1, 2, 3]</text><text x="44" y="517" fill="#dbe5f4" xml:space="preserve">  missing              -&gt; []</text><text x="44" y="546" fill="#dbe5f4" xml:space="preserve"></text><text x="44" y="575" fill="#dbe5f4" xml:space="preserve">Whitespace = OR; &amp; = AND; AND is evaluated first.</text></g>
</svg>